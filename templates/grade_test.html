{% extends 'base.html' %}{% block content %}<p class="eyebrow">ADMIN GRADING</p><h1>{{deck.title}} · {{user.username}}</h1><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}">{% for answer in test.answers %}<article class="card"><h2>{{cards[answer.card_id].prompt}}</h2><p><b>Response:</b> {{answer.response}}</p><label>Score<select name="score_{{answer.id}}"><option value="0" {% if answer.score==0 %}selected{% endif %}>0% · Incorrect</option><option value=".5" {% if answer.score==.5 %}selected{% endif %}>50% · Partially correct</option><option value="1" {% if answer.score==1 %}selected{% endif %}>100% · Correct</option></select></label></article>{% endfor %}<button class="primary">Finalize grades</button></form>{% endblock %}
