{% extends 'base.html' %}{% block title %}{{ 'Edit' if user else 'Add' }} user · Andrew{% endblock %}{% block content %}
<div class="page-heading"><div><p class="eyebrow">ADMINISTRATION</p><h1>{{ 'Manage user' if user else 'Add user' }}</h1></div><a class="button secondary" href="{{ url_for('users') }}">Cancel</a></div>
<section class="form-card narrow"><form method="post" class="form">{{ form.hidden_tag() }}<label>{{ form.username.label }}{{ form.username(autofocus=true) }}{% for e in form.username.errors %}<small class="error">{{ e }}</small>{% endfor %}</label><label>{{ form.password.label }}{{ form.password(placeholder='Leave blank to keep current password' if user else '') }}<small>At least 10 characters{% if user %}; leave blank to retain the existing password{% endif %}.</small>{% for e in form.password.errors %}<small class="error">{{ e }}</small>{% endfor %}</label><label class="check">{{ form.is_admin() }}<span><strong>Administrator access</strong><small>Can add and manage user accounts.</small></span></label><div class="actions">{{ form.submit(class_='button') }}</div></form></section>
{% endblock %}
