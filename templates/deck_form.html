{% extends 'base.html' %}{% block content %}<div class="editor-heading"><div><p class="eyebrow">DECK DETAILS</p><h1>{{'Edit' if deck else 'New'}} deck</h1></div>{% if deck %}<a class="cancel-link" href="{{url_for('deck_view',id=deck.id)}}">Cancel — back to deck</a>{% else %}<a class="cancel-link" href="{{url_for('home')}}">Cancel — all decks</a>{% endif %}</div><form method="post" class="deck-form">{{form.hidden_tag()}}<label>Deck name{{form.title(autofocus=true,placeholder='e.g. MS4 Basics')}}</label><label>Description{{form.description(rows=5,placeholder='What will this deck help you learn?')}}</label><button class="primary">Save deck details</button></form>{% endblock %}
