{% extends 'base.html' %}{% block content %}<h1>{{deck.title}}</h1><p>{{deck.description}}</p><a href="{{url_for('edit_deck',id=deck.id)}}">Edit deck</a><form class="inline" method="post" action="{{url_for('start',id=deck.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="primary">Review shuffled deck</button></form><p><a class="primary" href="{{url_for('new_card',id=deck.id)}}">+ New card</a></p>{% for c in deck.cards %}<article><small>{{c.kind}}</small><h3>{{c.prompt}}</h3><a href="{{url_for('edit_card',id=c.id)}}">Edit</a></article>{% else %}<p>No cards yet.</p>{% endfor %}{% endblock %}
