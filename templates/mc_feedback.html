{% extends 'base.html' %}{% block content %}<section class="feedback-card {{'feedback-correct' if attempt.score else 'feedback-incorrect'}}"><p class="eyebrow">REVIEW FEEDBACK</p><h1>{{'Correct!' if attempt.score else 'Not quite.'}}</h1><p class="feedback-question">{{card.prompt}}</p>{% if attempt.score %}<p>You selected the correct answer: <strong>{{correct.text}}</strong></p>{% else %}<p>The correct answer is: <strong>{{correct.text}}</strong></p>{% endif %}<form method="post" action="{{url_for('continue_study',id=study.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="primary">Continue</button></form></section>{% endblock %}
