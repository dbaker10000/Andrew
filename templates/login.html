{% extends 'base.html' %}{% block content %}<section class="auth"><p>RECALL STUDY</p><h1>Learn what matters.</h1><form method="post">{{form.hidden_tag()}}<label>Username{{form.username}}</label><label>Password{{form.password(id='p')}}<button type="button" onclick="p.type=p.type=='password'?'text':'password'">Show / hide</button></label>{{form.submit(class_='primary')}}<a href="{{url_for('reset_request')}}">Request password reset</a></form></section>{% endblock %}
