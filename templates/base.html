<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recall</title><link rel="stylesheet" href="{{url_for('static',filename='app.css')}}"><link rel="stylesheet" href="{{url_for('static',filename='accent.css')}}"><link rel="stylesheet" href="{{url_for('static',filename='card-actions.css')}}"><link rel="stylesheet" href="{{url_for('static',filename='card-controls.css')}}"><link rel="stylesheet" href="{{url_for('static',filename='deck-details.css')}}"><link rel="stylesheet" href="{{url_for('static',filename='tests.css')}}"><link rel="stylesheet" href="{{url_for('static',filename='score-actions.css')}}"><link rel="stylesheet" href="{{url_for('static',filename='question-options.css')}}"><link rel="stylesheet" href="{{url_for('static',filename='share-deck.css')}}"><link rel="stylesheet" href="{{url_for('static',filename='dashboard-actions.css')}}"><link rel="stylesheet" href="{{url_for('static',filename='mc-feedback.css')}}"><link rel="stylesheet" href="{{url_for('static',filename='card-correct-choice.css')}}"><link rel="stylesheet" href="{{url_for('static',filename='answer-text.css')}}"></head><body>{% if current_user.is_authenticated %}<header><a href="{{url_for('home')}}">✦ Recall</a><a href="{{url_for('home')}}">Decks</a><a href="{{url_for('change_password')}}">Change password</a>{% if current_user.is_admin %}<a href="{{url_for('users')}}">Admin</a>{% endif %}<span>{{current_user.username}}</span><form method="post" action="{{url_for('logout')}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button>Sign out</button></form></header>{% endif %}<main>{% for c,m in get_flashed_messages(with_categories=true) %}<p class="flash">{{m}}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
