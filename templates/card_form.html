{% extends 'base.html' %}{% block content %}<div class="editor-heading"><div><p class="eyebrow">{{deck.title}}</p><h1>{{'Edit' if card else 'New'}} card</h1></div><a class="cancel-link" href="{{url_for('deck_view',id=deck.id)}}">Cancel — back to deck</a></div><form method="post">{{form.hidden_tag()}}<label>Question{{form.prompt}}</label><label>Type{{form.kind(id='kind')}}</label><div id="answer">Answer{{form.answer}}</div><div id="choices">A{{form.a}} B{{form.b}} C{{form.c}} D{{form.d}}{{form.correct}}</div><div class="card-save-actions"><button class="primary" name="action" value="close">Save card</button>{% if not card %}<button class="primary accent" name="action" value="new">Save + new card</button>{% endif %}</div></form>{% if card %}<form method="post" action="{{url_for('delete_card',id=card.id)}}" class="delete-card"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="delete-button" onclick="return confirm('Delete this card permanently?')">Delete card</button></form>{% endif %}<script>let k=document.getElementById('kind'),a=document.getElementById('answer'),c=document.getElementById('choices');function t(){a.hidden=k.value==='multiple_choice';c.hidden=k.value!=='multiple_choice'}k.onchange=t;t()</script>{% endblock %}
