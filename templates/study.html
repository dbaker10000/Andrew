{% extends 'base.html' %}{% block content %}<p class="eyebrow">REVIEW · CARD {{number}} OF {{study.card_ids|length}}</p><h1 class="question-title">{{card.prompt}}</h1><form method="post" action="{{url_for('answer',id=study.id)}}" class="card question-form"><input type="hidden" name="csrf_token" value="{{csrf_token()}}">{% if card.kind=='multiple_choice' %}<div class="choice-list">{% for c in card.choices %}<label class="choice-option"><input type="radio" name="response" value="{{c.id}}" required><span>{{c.text}}</span></label>{% endfor %}</div>{% else %}<textarea name="response" required></textarea>{% endif %}<button class="primary question-submit">Submit answer</button></form>{% endblock %}
