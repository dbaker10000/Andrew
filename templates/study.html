{% extends 'base.html' %}{% block content %}<p>Card {{number}} of {{study.card_ids|length}}</p><h1>{{card.prompt}}</h1><form method="post" action="{{url_for('answer',id=study.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}">{% if card.kind=='multiple_choice' %}{% for c in card.choices %}<label><input type="radio" name="response" value="{{c.id}}" required> {{c.text}}</label>{% endfor %}{% else %}<textarea name="response" required></textarea>{% endif %}<button class="primary">Submit answer</button></form>{% endblock %}
