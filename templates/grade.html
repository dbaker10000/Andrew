{% extends 'base.html' %}{% block content %}<h1>Review your answer</h1><h2>Correct answer</h2><p>{{card.answer}}</p><h2>Your response</h2><p>{{attempt.response}}</p><form method="post" action="{{url_for('grade',id=study.id,aid=attempt.id)}}" class="score-actions"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="score-button incorrect" name="score" value="0">Incorrect <span>0%</span></button><button class="score-button partial" name="score" value=".5">Partially correct <span>50%</span></button><button class="score-button correct" name="score" value="1">Correct <span>100%</span></button></form>{% endblock %}
